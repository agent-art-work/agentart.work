name: Deploy a verified Cloudflare Pages artifact

on:
  workflow_call:
    secrets:
      CLOUDFLARE_PAGES_API_TOKEN:
        required: false
    inputs:
      target:
        type: string
        required: true
      branch:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      manifest_sha256:
        type: string
        required: true
      expected_production:
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/cloudflare-pages-ci' && inputs.target == 'preview') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'preview' || (inputs.target == 'production' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-${{ inputs.target }}
    env:
      RELEASE_DIRECTORY: local/ci-pages-release
      TARGET: ${{ inputs.target }}
      RELEASE_BRANCH: ${{ inputs.branch }}
      EXPECTED_PRODUCTION: ${{ inputs.expected_production }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: local/ci-pages-release
      - name: Verify the exact release files
        run: python3 -B scripts/check_cloudflare_release.py artifact "$RELEASE_DIRECTORY" "$MANIFEST_SHA256"
      - name: Read redacted Preview settings without uploading
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$TARGET" = preview
          python3 -B - <<'PYTHON'
          from hashlib import sha256
          import os
          from scripts import check_cloudflare_release as release

          project = release.pages_api()
          release.require(
              project.get("name") == release.PROJECT and project.get("subdomain") == release.PAGES_HOST
              and project.get("production_branch") == "main" and "agentart.work" in project.get("domains", []),
              "Unexpected Pages project, domain or production branch",
          )
          settings = project["deployment_configs"]["preview"]
          variables = settings.get("env_vars")
          if variables is None:
              variables = {}
          release.require(isinstance(variables, dict), "Unexpected Preview variable shape")
          for key in sorted(release.ACTIVATION_KEYS):
              if key not in variables:
                  state = "absent"
              else:
                  entry = variables[key]
                  if entry is None:
                      state = "json-null"
                  elif not isinstance(entry, dict):
                      state = "non-null-unexpected-shape"
                  elif entry.get("type") == "plain_text":
                      if "value" not in entry:
                          state = "plaintext-value-omitted"
                      elif entry["value"] is None:
                          state = "plaintext-value-null"
                      elif entry["value"] == "":
                          state = "plaintext-empty"
                      elif isinstance(entry["value"], str) and sha256(entry["value"].encode()).hexdigest() == (
                          "5694a7f76ba58ed3f8db76d0ad4f291a9ec637eaa135328decc3401d85dc79b9"
                      ):
                          state = "exact-inert-rehearsal-value"
                      else:
                          state = "other-plaintext-redacted"
                  elif entry.get("type") == "secret_text":
                      state = "secret-entry-redacted"
                  else:
                      state = "non-null-unexpected-type"
              print(f"PREVIEW_BINDING {key} {state}")
          build = project.get("build_config") or {}
          injection = any(build.get(key) for key in ("web_analytics_tag", "web_analytics_token"))
          print("PREVIEW_INJECTION", "present" if injection else "absent")
          try:
              release.verify_project(project, "preview", os.environ["RELEASE_BRANCH"])
          except ValueError:
              print("PREVIEW_GATE blocked")
          else:
              print("PREVIEW_GATE clear")
          PYTHON
