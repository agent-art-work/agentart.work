name: Agent Art Work Cloudflare Pages

on:
  pull_request:
  push:
    branches: [codex/cloudflare-pages-ci]
  workflow_dispatch:
    inputs:
      target:
        description: Highest release stage for this run
        type: choice
        options: [build, preview, production]
        default: build
      expected_production:
        description: Current Cloudflare Production deployment ID (required for promotion)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && 'agentart-cloudflare-release' || format('agentart-cloudflare-check-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.pin.outputs.name }}
      manifest_sha256: ${{ steps.pin.outputs.manifest_sha256 }}
    steps:
      - name: Validate the requested release stage
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
        env:
          EXPECTED_PRODUCTION: ${{ inputs.expected_production }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$EXPECTED_PRODUCTION" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]; then
            echo 'Production requires main and the current Production deployment ID.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check and package the OFF site
        run: |
          set -euo pipefail
          python3 -B scripts/check.py
          python3 -B -m unittest discover -s tests
          npm run build
          npm test
          npm run check:site
          node scripts/build-cloudflare-pages.mjs
      - name: Pin the artifact
        id: pin
        run: |
          set -euo pipefail
          package=local/cloudflare-pages
          digest=$(sha256sum "$package/manifest.json" | cut -d ' ' -f 1)
          python3 -B scripts/check_cloudflare_release.py artifact "$package" "$digest"
          {
            echo "name=cloudflare-pages-off-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "manifest_sha256=$digest"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pin.outputs.name }}
          path: |
            local/cloudflare-pages/_site
            local/cloudflare-pages/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  preview:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/cloudflare-pages-ci') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'preview' ||
        (inputs.target == 'production' && github.ref == 'refs/heads/main' && inputs.expected_production != '')))
    needs: build
    uses: ./.github/workflows/cloudflare-pages-deploy.yml
    with:
      target: preview
      branch: ci-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_name: ${{ needs.build.outputs.name }}
      manifest_sha256: ${{ needs.build.outputs.manifest_sha256 }}

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: [build, preview]
    uses: ./.github/workflows/cloudflare-pages-deploy.yml
    with:
      target: production
      branch: main
      artifact_name: ${{ needs.build.outputs.name }}
      manifest_sha256: ${{ needs.build.outputs.manifest_sha256 }}
      expected_production: ${{ inputs.expected_production }}
